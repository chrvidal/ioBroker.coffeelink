name: Test and Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-**']
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: 22

  adapter-tests:
    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Configure the second loopback address on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 255.255.255.255
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node }}
          os: ${{ matrix.os }}
          extra-tests: npm run check
