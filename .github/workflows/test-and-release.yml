name: Test and Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-**']
  pull_request: {}
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected version tag to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: 22
          lint: true

  adapter-tests:
    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Configure the second loopback address on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 255.255.255.255
      - uses: ioBroker/testing-action-adapter@v1
        if: runner.os != 'Windows'
        with:
          node-version: ${{ matrix.node }}
          os: ${{ matrix.os }}
          extra-tests: npm run check
      - uses: actions/checkout@v6
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v6
        if: runner.os == 'Windows'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install test dependencies on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000
      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        run: npm.cmd run check
      - name: Run ioBroker integration tests on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env:
          DEBUG: 'testing:integration:*'
        run: npm.cmd run test:integration -- --exit

  deploy:
    needs: [check-and-lint, adapter-tests]
    if: github.repository == 'chrvidal/ioBroker.coffeelink' && github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - name: Check whether this version was already published
        id: npm
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "iobroker.coffeelink@$VERSION" version > /tmp/npm-version.txt 2> /tmp/npm-error.txt; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' /tmp/npm-error.txt; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/npm-error.txt
            exit 1
          fi
      - name: Publish with npm Trusted Publishing
        if: steps.npm.outputs.published == 'false'
        uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: 24
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure GitHub release for a manually published version
        if: steps.npm.outputs.published == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
