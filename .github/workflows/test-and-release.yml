name: Test and Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-**']
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: 22

  adapter-tests:
    needs: check-and-lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Configure the second loopback address on macOS
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 255.255.255.255
      - uses: ioBroker/testing-action-adapter@v1
        if: runner.os != 'Windows'
        with:
          node-version: ${{ matrix.node }}
          os: ${{ matrix.os }}
          extra-tests: npm run check
      - uses: actions/checkout@v6
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v6
        if: runner.os == 'Windows'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install test dependencies on Windows
        if: runner.os == 'Windows'
        run: npm.cmd ci
      - name: Run unit tests on Windows
        if: runner.os == 'Windows'
        run: npm.cmd run check
      - name: Run ioBroker integration tests on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: npm.cmd run test:integration -- --exit
